name: GymTracker
options:
  bundleIdPrefix: com.torokpeter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Pick your Personal Team once in Xcode (Signing & Capabilities) or put its ID here.
    DEVELOPMENT_TEAM: ""

targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - GymTracker
      - Shared
    dependencies:
      - target: ShareExtension
    info:
      path: GymTracker/Info.plist
      properties:
        CFBundleDisplayName: Gym Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.torokpeter.gymtracker
            CFBundleURLSchemes: [gymtracker]
        # The video analyzer runs on your own Mac, reached over plain HTTP on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Gym Tracker talks to the video analyzer running on your Mac to identify exercises in saved videos.
    entitlements:
      path: GymTracker/GymTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.torokpeter.gymtracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torokpeter.gymtracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Gym Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.torokpeter.gymtracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torokpeter.gymtracker.share
        TARGETED_DEVICE_FAMILY: "1"

  GymTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GymTrackerTests
    dependencies:
      - target: GymTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.torokpeter.gymtracker.tests

  # Simulator walkthrough of the main flows. Kept out of the app's own scheme so
  # ⌘U stays fast and a device build never has to sign it.
  GymTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GymTrackerUITests
    dependencies:
      - target: GymTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.torokpeter.gymtracker.uitests
        TEST_TARGET_NAME: GymTracker

schemes:
  GymTracker:
    build:
      targets:
        GymTracker: all
        GymTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GymTrackerTests
  GymTrackerUITests:
    build:
      targets:
        GymTracker: all
        GymTrackerUITests: [test]
    test:
      config: Debug
      targets:
        - GymTrackerUITests
